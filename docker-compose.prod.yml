version: '3.8'

# 生产环境：仅运行 Redis
# 后端服务在本机运行，数据库在本机安装

services:
  redis:
    image: redis:7-alpine
    container_name: mt5-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
