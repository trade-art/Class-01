version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mt5-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mt5admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mt5_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mt5admin} -d ${DB_NAME:-mt5_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: mt5-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Platform Service (Platform Admin API)
  platform-service:
    build:
      context: ./apps/platform-service
      dockerfile: Dockerfile
    container_name: mt5-platform-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-mt5admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mt5_platform}?schema=platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    expose:
      - "3001"

  # Tenant API (Tenant Backend)
  tenant-api:
    build:
      context: ./apps/tenant-api
      dockerfile: Dockerfile
    container_name: mt5-tenant-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-mt5admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mt5_platform}?schema=tenant
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${TENANT_JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${TENANT_JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      PLATFORM_API_URL: http://platform-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-service:
        condition: service_started
    networks:
      - backend
    expose:
      - "3002"

  # Platform Console (Admin Frontend)
  platform-console:
    build:
      context: .
      dockerfile: ./apps/platform-console/Dockerfile
    container_name: mt5-platform-console
    restart: always
    networks:
      - frontend
      - backend
    expose:
      - "80"

  # Tenant Console (Tenant Frontend)
  tenant-console:
    build:
      context: ./apps/tenant-console
      dockerfile: Dockerfile
    container_name: mt5-tenant-console
    restart: always
    networks:
      - frontend
      - backend
    expose:
      - "80"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mt5-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - platform-service
      - tenant-api
      - platform-console
      - tenant-console
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
