services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mt5-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mt5admin
      POSTGRES_PASSWORD: mt5platform2024
      POSTGRES_DB: mt5_platform
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5admin -d mt5_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: mt5-platform-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Platform Service (Backend API)
  platform-service:
    image: node:20-slim
    container_name: mt5-platform-service
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://mt5admin:mt5platform2024@postgres:5432/mt5_platform?schema=platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/platform-service:/app
      - platform_service_modules:/app/node_modules
    command: sh -c "apt-get update && apt-get install -y openssl libssl-dev && npm install && npx prisma generate && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  platform_service_modules:
