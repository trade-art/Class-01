# Prometheus Configuration for MT5 Platform
# SSL Certificate and Security Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # 标签
  external_labels:
    monitor: 'mt5-platform'
    environment: 'production'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 告警规则文件
rule_files:
  - "alert-rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tenant API 服务
  - job_name: 'tenant-api'
    metrics_path: '/tenant/metrics'
    static_configs:
      - targets: ['tenant-api:3002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # Nginx Gateway
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-gateway:9113']

  # SSL 证书检查 (通过 blackbox exporter)
  - job_name: 'ssl-probe'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://localhost:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Node Exporter (系统指标)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
