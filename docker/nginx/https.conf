# ============================================
# MT5 Platform HTTPS Server Configuration
# Include this file when SSL certificates are available
# ============================================

# HTTP to HTTPS redirect server
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Include SSL configuration
    include /etc/nginx/ssl.conf;

    # Request size limits
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # ============================================
    # Health Check Endpoints
    # ============================================
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /ready {
        access_log off;
        proxy_pass http://tenant_api/api/health/ready;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ============================================
    # API Routes (through tenant-api)
    # ============================================
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;
        limit_req zone=tenant_limit burst=200 nodelay;
        limit_conn tenant_conn 100;

        # Proxy settings
        proxy_pass http://tenant_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Pass tenant headers
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header X-Tenant-Code $http_x_tenant_code;
        proxy_set_header X-Server-Id $http_x_server_id;
        proxy_set_header X-Deployment-Mode $http_x_deployment_mode;

        # Connection settings
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ============================================
    # WebSocket Routes (Secure WebSocket - WSS)
    # ============================================
    location /ws {
        limit_conn tenant_conn 50;

        proxy_pass http://tenant_api;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass tenant headers
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header X-Tenant-Code $http_x_tenant_code;

        # Long-lived connection settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================
    # Direct Middleware Routes (internal use only)
    # ============================================
    location /middleware/ {
        internal;

        set $backend $middleware_upstream;
        proxy_pass http://$backend/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header X-Server-Id $http_x_server_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Static Files
    # ============================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
