# =============================================================================
# MT5 Platform - Nginx Default Server Configuration
# API Gateway with load balancing and SSL support
# =============================================================================

# ============================================
# Upstream Definitions
# ============================================

# Tenant API Backend
upstream tenant_api {
    least_conn;
    server tenant-api:3000 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Platform Service Backend
upstream platform_service {
    least_conn;
    server platform-service:3001 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Tenant Console Frontend (Production)
upstream tenant_console {
    server tenant-console-prod:80 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Platform Console Frontend (Production)
upstream platform_console {
    server platform-console-prod:80 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ============================================
# Rate Limiting Zones
# ============================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $http_x_tenant_id zone=tenant_limit:10m rate=1000r/s;
limit_conn_zone $http_x_tenant_id zone=tenant_conn:10m;

# ============================================
# HTTP Server (Redirect to HTTPS in production)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health check endpoint (always available on HTTP)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # In production, redirect to HTTPS
    # Uncomment for production:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # For development, serve directly
    include /etc/nginx/conf.d/locations.conf;
}

