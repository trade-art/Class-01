# =============================================================================
# MT5 Platform - Nginx Location Blocks
# Shared location configuration for HTTP and HTTPS servers
# =============================================================================

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Request size limits
client_max_body_size 10m;
client_body_buffer_size 128k;

# ============================================
# Health Check Endpoints
# ============================================
location = /health {
    access_log off;
    proxy_pass http://tenant_api/health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}

location = /ready {
    access_log off;
    proxy_pass http://tenant_api/health/ready;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}

# ============================================
# Tenant API Routes
# ============================================
location /api/v1/ {
    # Rate limiting
    limit_req zone=api_limit burst=50 nodelay;
    limit_req zone=tenant_limit burst=200 nodelay;
    limit_conn tenant_conn 100;

    # Proxy to tenant-api (strips /api/v1/ prefix, passes remaining path to tenant-api)
    proxy_pass http://tenant_api/;
    proxy_http_version 1.1;

    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Pass tenant headers
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_set_header X-Request-Id $request_id;

    # Connection settings
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
}

# ============================================
# Platform API Routes
# ============================================
location /platform-api/ {
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn tenant_conn 100;

    proxy_pass http://platform_service/api/v1/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
}

# ============================================
# WebSocket Routes
# ============================================
location /ws/ {
    limit_conn tenant_conn 50;

    proxy_pass http://tenant_api/ws/;
    proxy_http_version 1.1;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Pass tenant headers
    proxy_set_header X-Tenant-Id $http_x_tenant_id;

    # Long-lived connection settings
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ============================================
# Metrics Endpoint (Internal)
# ============================================
location /metrics {
    # Restrict to internal networks
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    proxy_pass http://tenant_api/metrics;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# ============================================
# Tenant Console (Frontend)
# ============================================
location /tenant/ {
    proxy_pass http://tenant_console/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Cache static assets
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
}

# ============================================
# Platform Console (Frontend)
# ============================================
location /platform/ {
    proxy_pass http://platform_console/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Cache static assets
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
}

# ============================================
# Default Route
# ============================================
location / {
    # Redirect to tenant console by default
    return 302 /tenant/;
}

# ============================================
# Deny Hidden Files
# ============================================
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
