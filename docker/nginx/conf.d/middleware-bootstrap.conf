# ============================================
# Middleware Bootstrap API Configuration
# 中间件引导API配置 - 用于无配置文件启动
# ============================================
#
# 域名: config.mt5platform.io (需要在DNS中配置)
# 用途: 为中间件提供启动配置拉取服务
# 安全: 只暴露引导相关端点，其他全部拒绝
#

# 引导API专用限流区域
limit_req_zone $binary_remote_addr zone=bootstrap_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=heartbeat_limit:10m rate=5r/s;

# Platform Service 上游
upstream platform_service {
    server platform-service:3001 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

# ============================================
# 中间件配置服务器 (HTTPS)
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name config.mt5platform.io;

    # SSL 配置
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 隐藏服务器信息
    server_tokens off;

    # 日志
    access_log /var/log/nginx/middleware-bootstrap-access.log main;
    error_log /var/log/nginx/middleware-bootstrap-error.log warn;

    # ============================================
    # 引导API端点 - 获取启动配置
    # POST /api/v1/bootstrap/register
    # ============================================
    location = /api/v1/bootstrap/register {
        # 严格限流: 每分钟10次
        limit_req zone=bootstrap_limit burst=3 nodelay;
        limit_req_status 429;

        # 只允许 POST
        limit_except POST {
            deny all;
        }

        # 请求体大小限制
        client_max_body_size 4k;

        # 代理到 Platform Service
        proxy_pass http://platform_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # 配置拉取端点
    # GET /api/v1/bootstrap/{middlewareId}/config
    # ============================================
    location ~ ^/api/v1/bootstrap/([a-zA-Z0-9_-]+)/config$ {
        # 限流: 每分钟10次
        limit_req zone=bootstrap_limit burst=5 nodelay;
        limit_req_status 429;

        # 只允许 GET
        limit_except GET {
            deny all;
        }

        proxy_pass http://platform_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # 心跳端点
    # POST /api/v1/bootstrap/{middlewareId}/heartbeat
    # ============================================
    location ~ ^/api/v1/bootstrap/([a-zA-Z0-9_-]+)/heartbeat$ {
        # 心跳限流: 每秒5次 (正常30秒一次)
        limit_req zone=heartbeat_limit burst=10 nodelay;
        limit_req_status 429;

        # 只允许 POST
        limit_except POST {
            deny all;
        }

        client_max_body_size 8k;

        proxy_pass http://platform_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ============================================
    # 健康检查端点 (无认证)
    # GET /health
    # ============================================
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"middleware-bootstrap"}';
        add_header Content-Type application/json;
    }

    # ============================================
    # 其他所有请求 - 拒绝
    # ============================================
    location / {
        return 403 '{"error":"Forbidden","message":"This endpoint only serves middleware bootstrap API"}';
        add_header Content-Type application/json always;
    }
}

# ============================================
# HTTP 重定向到 HTTPS
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name config.mt5platform.io;

    # 健康检查可以走HTTP
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # 其他全部重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
