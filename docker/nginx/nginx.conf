# MT5 Platform API Gateway Configuration
# Multi-tenant routing based on deployment mode

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with tenant info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'tenant="$http_x_tenant_id" server="$http_x_server_id"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $http_x_tenant_id zone=tenant_limit:10m rate=1000r/s;

    # Connection limiting per tenant
    limit_conn_zone $http_x_tenant_id zone=tenant_conn:10m;

    # ============================================
    # Upstream Definitions
    # ============================================

    # Tenant API (backend)
    upstream tenant_api {
        least_conn;
        server tenant-api:3002 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Shared middleware pool (for SHARED deployment mode)
    upstream middleware_shared {
        least_conn;
        server middleware-shared-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server middleware-shared-2:8080 weight=1 max_fails=3 fail_timeout=30s backup;
        keepalive 16;
    }

    # Dedicated middleware instances (configured per tenant)
    # These are dynamically added based on tenant configuration
    # Example: tenant-acme uses dedicated middleware at middleware-acme:8080
    upstream middleware_acme {
        server middleware-acme:8080 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream middleware_enterprise {
        server middleware-enterprise:8080 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ============================================
    # Tenant Routing Map
    # Maps tenant code to middleware upstream
    # Update this map when adding new dedicated tenants
    # ============================================
    map $http_x_tenant_code $middleware_upstream {
        default         "middleware_shared";
        "acme"          "middleware_acme";
        "enterprise"    "middleware_enterprise";
        # Add more dedicated tenants here:
        # "tenant_code"   "middleware_tenant_code";
    }

    # Map for deployment mode (set by tenant-api lookup)
    map $http_x_deployment_mode $use_dedicated {
        default         0;
        "DEDICATED"     1;
    }

    # ============================================
    # Main Server Block
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Request size limits
        client_max_body_size 10m;
        client_body_buffer_size 128k;

        # ============================================
        # Health Check Endpoints
        # ============================================
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location = /ready {
            access_log off;
            proxy_pass http://tenant_api/api/health/ready;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ============================================
        # API Routes (through tenant-api)
        # ============================================
        location /api {
            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;
            limit_req zone=tenant_limit burst=200 nodelay;
            limit_conn tenant_conn 100;

            # Proxy settings
            proxy_pass http://tenant_api;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Pass tenant headers
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Tenant-Code $http_x_tenant_code;
            proxy_set_header X-Server-Id $http_x_server_id;
            proxy_set_header X-Deployment-Mode $http_x_deployment_mode;

            # Connection settings
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ============================================
        # WebSocket Routes
        # ============================================
        location /ws {
            limit_conn tenant_conn 50;

            proxy_pass http://tenant_api;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Pass tenant headers
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Tenant-Code $http_x_tenant_code;

            # Long-lived connection settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ============================================
        # Direct Middleware Routes (internal use only)
        # For direct middleware access based on deployment mode
        # ============================================
        location /middleware/ {
            internal; # Only accessible from internal redirects

            # Dynamic upstream selection based on tenant code
            set $backend $middleware_upstream;
            proxy_pass http://$backend/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Server-Id $http_x_server_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ============================================
        # Static Files (for frontend if served here)
        # ============================================
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================
    # HTTPS Server (when SSL is configured)
    # ============================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Include the same location blocks as above
    # }
}
