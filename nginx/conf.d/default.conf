# Default server - redirect to tenant console
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 http://app.localhost$request_uri;
    }
}
