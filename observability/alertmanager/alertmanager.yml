# Alertmanager 配置文件
# 告警路由和通知配置

global:
  # 默认 SMTP 配置
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@mt5-platform.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # 默认 Slack 配置
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # 解决超时
  resolve_timeout: 5m

# 告警模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 路由配置
route:
  # 默认接收器
  receiver: 'default-receiver'

  # 分组配置
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # 子路由
  routes:
    # 关键告警 - 立即通知
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    # 安全相关告警
    - match:
        category: security
      receiver: 'security-receiver'
      group_wait: 10s
      repeat_interval: 30m
      continue: false

    # 业务告警
    - match:
        category: business
      receiver: 'business-receiver'
      group_wait: 1m
      repeat_interval: 2h
      continue: false

    # 警告级别告警
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h

    # 信息级别告警
    - match:
        severity: info
      receiver: 'info-receiver'
      group_wait: 5m
      repeat_interval: 12h

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default-receiver'
    email_configs:
      - to: 'ops-team@mt5-platform.com'
        send_resolved: true
        headers:
          subject: '[MT5] {{ .Status | toUpper }} - {{ .CommonAnnotations.summary }}'

  # 关键告警接收器
  - name: 'critical-receiver'
    email_configs:
      - to: 'critical-alerts@mt5-platform.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#mt5-critical-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }} {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    # webhook_configs:
    #   - url: 'http://pagerduty-webhook:8080/v2/enqueue'
    #     send_resolved: true

  # 安全告警接收器
  - name: 'security-receiver'
    email_configs:
      - to: 'security-team@mt5-platform.com'
        send_resolved: true
        headers:
          subject: '[SECURITY] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#mt5-security-alerts'
        send_resolved: true
        title: ':shield: Security Alert: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'warning'

  # 业务告警接收器
  - name: 'business-receiver'
    email_configs:
      - to: 'business-ops@mt5-platform.com'
        send_resolved: true
        headers:
          subject: '[BUSINESS] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#mt5-business-alerts'
        send_resolved: true
        title: ':chart_with_upwards_trend: Business Alert: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # 警告接收器
  - name: 'warning-receiver'
    email_configs:
      - to: 'ops-team@mt5-platform.com'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#mt5-warnings'
        send_resolved: true
        title: ':warning: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'warning'

  # 信息接收器
  - name: 'info-receiver'
    slack_configs:
      - channel: '#mt5-info'
        send_resolved: false
        title: ':information_source: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

# 抑制规则
inhibit_rules:
  # 关键告警抑制警告告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # 关键告警抑制信息告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']

  # 警告告警抑制信息告警
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']
