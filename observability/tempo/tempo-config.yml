# Tempo 配置文件
# 分布式追踪存储服务

server:
  http_listen_port: 3200
  log_level: info

# 分发器配置
distributor:
  receivers:
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_binary:
          endpoint: 0.0.0.0:6831
        thrift_compact:
          endpoint: 0.0.0.0:6832
    zipkin:
      endpoint: 0.0.0.0:9411
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# 摄取器配置
ingester:
  max_block_duration: 5m

# 压缩器配置
compactor:
  compaction:
    block_retention: 720h  # 30 days

# 指标生成器配置
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: mt5-platform
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# 存储配置
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# 覆盖配置
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
    ingestion:
      rate_limit_bytes: 15000000
      burst_size_bytes: 20000000
      max_traces_per_user: 10000

# 查询前端配置
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
