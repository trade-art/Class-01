# Promtail 配置文件
# 日志收集代理，将日志发送到 Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: mt5-platform
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Tenant API 应用日志
  - job_name: tenant-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: tenant-api
          service: tenant-api
          environment: ${ENVIRONMENT:-development}
          __path__: /var/log/tenant-api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            timestamp: time
            requestId: requestId
            traceId: traceId
            tenantId: tenantId
            userId: userId
            module: module
            operation: operation
      - labels:
          level:
          tenantId:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  # Admin API 应用日志
  - job_name: admin-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: admin-api
          service: admin-api
          environment: ${ENVIRONMENT:-development}
          __path__: /var/log/admin-api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            timestamp: time
            requestId: requestId
            traceId: traceId
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  # Docker 容器日志
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 只收集带有特定标签的容器
      - source_labels: ['__meta_docker_container_label_logging']
        regex: 'true'
        action: keep
      # 设置服务名称
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            timestamp: time
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - UnixMs
      - output:
          source: message

  # Nginx 访问日志
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>[^\]]*)\] "(?P<request>[^"]*)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"

  # Nginx 错误日志
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          level: error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: time
          format: "2006/01/02 15:04:05"

  # PostgreSQL 日志
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+) (?P<timezone>\w+) \[(?P<pid>\d+)\] (?P<level>\w+):  (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000"

  # Redis 日志
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>[XCSM]) (?P<timestamp>\d{2} \w+ \d{4} \d{2}:\d{2}:\d{2}\.\d+) (?P<level>[.*#-]) (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "02 Jan 2006 15:04:05.000"

# 限制配置
limits_config:
  readline_rate_enabled: true
  readline_rate: 100
  readline_burst: 200
  readline_rate_drop: false

# 目标同步配置
target_config:
  sync_period: 10s
