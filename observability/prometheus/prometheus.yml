# Prometheus 配置文件
# 指标收集和存储服务

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: mt5-platform
    environment: ${ENVIRONMENT:-development}

# 告警规则文件
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 抓取配置
scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tenant API 应用指标
  - job_name: 'tenant-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:15000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: '${1}'

  # Admin API 应用指标
  - job_name: 'admin-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:15001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: '${1}'

  # Node Exporter - 系统指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL 指标
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis 指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Nginx 指标
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Docker 容器指标
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Loki 指标
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Tempo 指标
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Docker Swarm 服务发现（可选）
  # - job_name: 'docker-swarm'
  #   dockerswarm_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       role: tasks
  #   relabel_configs:
  #     - source_labels: [__meta_dockerswarm_service_label_prometheus_job]
  #       target_label: job
  #     - source_labels: [__meta_dockerswarm_service_name]
  #       target_label: service
