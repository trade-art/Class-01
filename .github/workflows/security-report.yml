name: Weekly Security Report

on:
  schedule:
    # 每周一早上 9 点 (UTC) 运行
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      notify_slack:
        description: '发送 Slack 通知'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '20.x'

jobs:
  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install report tools
        run: npm install -g license-checker

      - name: Generate security report
        id: report
        run: |
          chmod +x scripts/generate-security-report.sh
          ./scripts/generate-security-report.sh || true

          # 获取报告日期
          REPORT_DATE=$(date +%Y-%m-%d)
          echo "report_date=${REPORT_DATE}" >> $GITHUB_OUTPUT

          # 读取漏洞统计
          if [ -f "security-reports/npm-audit-raw.json" ]; then
            CRITICAL=$(cat security-reports/npm-audit-raw.json | jq '.metadata.vulnerabilities.critical // 0')
            HIGH=$(cat security-reports/npm-audit-raw.json | jq '.metadata.vulnerabilities.high // 0')
            MODERATE=$(cat security-reports/npm-audit-raw.json | jq '.metadata.vulnerabilities.moderate // 0')
            LOW=$(cat security-reports/npm-audit-raw.json | jq '.metadata.vulnerabilities.low // 0')

            echo "critical=${CRITICAL}" >> $GITHUB_OUTPUT
            echo "high=${HIGH}" >> $GITHUB_OUTPUT
            echo "moderate=${MODERATE}" >> $GITHUB_OUTPUT
            echo "low=${LOW}" >> $GITHUB_OUTPUT
          fi

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ steps.report.outputs.report_date }}
          path: security-reports/
          retention-days: 90

      - name: Create issue for vulnerabilities
        if: steps.report.outputs.critical > 0 || steps.report.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            const critical = parseInt('${{ steps.report.outputs.critical }}') || 0;
            const high = parseInt('${{ steps.report.outputs.high }}') || 0;
            const moderate = parseInt('${{ steps.report.outputs.moderate }}') || 0;
            const low = parseInt('${{ steps.report.outputs.low }}') || 0;

            const title = `🔒 Security Alert: ${critical} critical, ${high} high severity vulnerabilities found`;

            const body = `## Weekly Security Scan Results

            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            | 🟡 Moderate | ${moderate} |
            | ⚪ Low | ${low} |

            ### Actions Required

            1. Run \`npm audit\` locally to see detailed vulnerability information
            2. Run \`npm audit fix\` to automatically fix compatible updates
            3. For breaking changes, manually update affected packages

            ### Report Details

            Download the full security report from the [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            ---
            *This issue was automatically created by the security scan workflow.*
            `;

            // 检查是否已有类似的 open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Security Alert') &&
              issue.title.includes('vulnerabilities found')
            );

            if (existingIssue) {
              // 更新现有 issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Updated Security Scan - ${new Date().toISOString().split('T')[0]}\n\n${body}`
              });
              console.log(`Updated existing security issue #${existingIssue.number}`);
            } else {
              // 创建新 issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'high-priority']
              });
              console.log('Created new security issue');
            }

      - name: Post summary
        run: |
          echo "## Weekly Security Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report Date**: ${{ steps.report.outputs.report_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.report.outputs.critical }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.report.outputs.high }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | ${{ steps.report.outputs.moderate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ Low | ${{ steps.report.outputs.low }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.report.outputs.critical }}" -gt 0 ] || [ "${{ steps.report.outputs.high }}" -gt 0 ]; then
            echo "⚠️ **Action Required**: Critical or high severity vulnerabilities detected!" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No critical or high severity vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Slack notification
        if: ${{ github.event.inputs.notify_slack == 'true' || github.event_name == 'schedule' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Weekly Security Report - ${{ steps.report.outputs.report_date }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🔒 Weekly Security Report"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Critical:* ${{ steps.report.outputs.critical }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*High:* ${{ steps.report.outputs.high }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Moderate:* ${{ steps.report.outputs.moderate }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Low:* ${{ steps.report.outputs.low }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Report>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
