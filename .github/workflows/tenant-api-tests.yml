name: Tenant API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: apps/tenant-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        working-directory: ${{ env.WORKING_DIRECTORY }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run unit tests
        run: npm run test:cov
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.WORKING_DIRECTORY }}/coverage/lcov.info
          flags: tenant-api-unit
          name: tenant-api-unit
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run E2E tests
        run: npm run test:e2e:ci
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-e2e-testing
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-e2e-testing
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-api-e2e-results
          path: |
            ${{ env.WORKING_DIRECTORY }}/reports/e2e-results.xml
            ${{ env.WORKING_DIRECTORY }}/coverage-e2e/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tenant API E2E Results
          path: ${{ env.WORKING_DIRECTORY }}/reports/e2e-results.xml
          reporter: jest-junit
          fail-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-api-build
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 7
